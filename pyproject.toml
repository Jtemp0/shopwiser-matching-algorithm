[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "shopwiser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.9.0",
    "lightgbm>=4.5.0",
    "anthropic>=0.75.0",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.0.0",
    "matplotlib>=3.10.8",
    "networkx>=3.4",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "quantulum3>=0.9.2",
    "rapidfuzz>=3.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.2.2",
    "setuptools>=80.10.2",
    "tqdm>=4.66.0",
]
